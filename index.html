<style>
:root{--bg:#f3f6fa;--panel:#fff;--ink:#15253c;--muted:#6b7a90;--line:#e4eaf1;--navy:#12213a;--aqua:#18b7a3;--light:#e7faf6;--red:#c44747;--amber:#a66a0b;--shadow:0 10px 28px rgba(28,49,78,.06)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.5;cursor:not-allowed}
header{background:linear-gradient(128deg,#12213a,#1d4161);color:#fff;padding:21px max(18px,calc((100vw - 1160px)/2));box-shadow:0 3px 14px #0001}.brand{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.brand h1{font-size:22px;letter-spacing:-.5px;margin:0}.brand p{margin:2px 0 0;color:#bfcbdd;font-size:12px}.brand-mark{display:block;width:76px;height:76px;flex:0 0 76px;border-radius:50%;background:white;object-fit:contain;margin-right:14px;box-shadow:0 4px 16px rgba(0,0,0,.22)}.brand-left{display:flex;align-items:center;min-width:0}.brand-left>div{min-width:0}.brand p{max-width:340px}
.shell{max-width:1160px;margin:auto;padding:18px 18px 45px}.tabs{display:flex;gap:7px;overflow-x:auto;margin-bottom:20px;padding-bottom:4px}.tab{border:1px solid var(--line);background:white;color:var(--muted);padding:10px 15px;border-radius:12px;white-space:nowrap;font-weight:650}.tab.active{background:var(--navy);color:#fff;border-color:var(--navy)}.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:650;background:var(--navy);color:#fff}.btn.primary{background:var(--aqua);color:#052b29}.btn.ghost{background:#eaf0f6;color:var(--ink)}.btn.outline{border:1px solid var(--line);background:white;color:var(--ink)}.btn.danger{color:var(--red);background:#faebeb}.btn.small{padding:6px 10px;font-size:12px}.btn:focus-visible,.tab:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #75d7ce;outline-offset:2px}

/* Version 1.2.1: fixed top branding + navigation on all seven pages. */
:root{--app-bar-height:148px}
html{scroll-padding-top:calc(var(--app-bar-height) + 12px)}
body{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;padding-top:var(--app-bar-height)}
.fixed-app-bar{position:fixed;inset:0 0 auto 0;z-index:100;background:#fff;box-shadow:0 5px 18px rgba(18,33,58,.14);padding-top:env(safe-area-inset-top,0px)}
.fixed-app-bar header{padding:10px max(18px,calc((100vw - 1160px)/2));box-shadow:none}
.fixed-app-bar .brand-mark{width:54px;height:54px;flex-basis:54px;margin-right:12px}
.fixed-app-bar .brand h1{font-size:19px;line-height:1.2}
.fixed-app-bar .brand p{font-size:11px}
.fixed-app-bar .tabs{width:100%;max-width:1160px;margin:0 auto;padding:8px 18px 10px;display:flex;gap:7px;overflow-x:auto;white-space:nowrap;scrollbar-width:thin;-webkit-overflow-scrolling:touch;overscroll-behavior-inline:contain}
.fixed-app-bar .tabs .tab{flex:0 0 auto;padding:8px 12px}
.shell{width:100%;flex:1;display:flex;flex-direction:column;padding-top:19px}
#app{flex:1}
.app-footer{margin-top:18px;border-top:1px solid var(--line);padding:17px 4px 4px;display:flex;align-items:center;justify-content:space-between;gap:6px 14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.app-footer #appVersion{font-weight:750;color:#526782}

 .fixed-app-bar header{padding:9px 12px}
 .fixed-app-bar .brand-mark{width:43px;height:43px;flex-basis:43px;margin-right:9px}
 .fixed-app-bar .brand h1{font-size:16px;line-height:1.18}
 .fixed-app-bar .brand p{font-size:10px;line-height:1.3;margin-top:3px}
 .fixed-app-bar .brand .pill{font-size:9px;padding:4px 7px}
 .fixed-app-bar .tabs{padding:7px 12px 9px;gap:6px}
 .fixed-app-bar .tabs .tab{padding:8px 10px;font-size:12px}
 .shell{padding-top:13px}
}
@media(max-width:365px){.fixed-app-bar .brand .pill{display:none}}
/* v1.2.2: same-origin, no-cost GitHub Pages update checker. */
.update-summary{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:14px 0}
.update-version{background:#f5f8fb;border:1px solid var(--line);border-radius:12px;padding:12px;min-width:0}
.update-version span{display:block;color:var(--muted);font-size:12px}
.update-version strong{display:block;font-size:18px;margin-top:3px;overflow-wrap:anywhere}
.update-status{margin:12px 0 0;border-radius:11px;background:#f2f6fa;padding:11px 12px;color:#42566a;font-size:13px}
.update-status.ready{background:#e4f8ef;color:#116946}
.update-status.new{background:#fff2d8;color:#755105}
.update-status.error{background:#fff0f0;color:#963838}
.update-panel .actions{align-items:center}
@media(max-width:370px){.update-summary{grid-template-columns:1fr}}

.offline-panel .actions{margin-top:10px}
.offline-footnote{font-size:12px;color:var(--muted);line-height:1.6;margin-top:9px}

const KEY='rico-utility-monitor-v1'; // unchanged: existing bills remain on this device
const TYPES={electricity:{name:'Electricity',icon:'⚡',unit:'kWh'},water:{name:'Water',icon:'💧',unit:'m³'},car:{name:'Car Fuel',icon:'🚗',unit:'L'},motorcycle:{name:'Motorcycle Fuel',icon:'🏍️',unit:'L'},lpg:{name:'LPG / Cooking Gas',icon:'🔥',unit:'kg'}};
const $=s=>document.querySelector(s), money=n=>'₱'+(Number(n)||0).toLocaleString('en-PH',{minimumFractionDigits:2,maximumFractionDigits:2}),num=n=>(Number(n)||0).toLocaleString('en-PH',{maximumFractionDigits:2});
const today=()=>{const d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')},monthNow=()=>today().slice(0,7);
const escape=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dateLabel=s=>{if(!/^\d{4}-\d{2}-\d{2}$/.test(s||''))return s||'';const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d).toLocaleDateString('en-PH',{month:'short',day:'numeric',year:'numeric'})};
const monthLabel=s=>{const [y,m]=s.split('-').map(Number);return new Date(y,m-1,1).toLocaleDateString('en-PH',{month:'short',year:'numeric'})};
const id=()=>typeof crypto!=='undefined'&&crypto.randomUUID?crypto.randomUUID():'id-'+Date.now()+'-'+Math.random().toString(36).slice(2);
const validDate=s=>typeof s==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(s)&&!Number.isNaN(new Date(s+'T12:00:00').getTime());
const safeNum=x=>x===null||x===''||x===undefined?null:(Number.isFinite(Number(x))?Number(x):null);
const dayCount=(a,b)=>validDate(a)&&validDate(b)?Math.round((Date.parse(b+'T12:00:00Z')-Date.parse(a+'T12:00:00Z'))/86400000):null;
const plusDays=(a,n)=>{if(!validDate(a)||!Number.isFinite(n))return '';const d=new Date(a+'T12:00:00Z');d.setUTCDate(d.getUTCDate()+Math.round(n));return d.toISOString().slice(0,10)};
const fmt=n=>n===null||!Number.isFinite(n)?'—':num(n);
const signed=(n,asMoney=false)=>n===null||!Number.isFinite(n)?'—':(n>0?'+':'')+(asMoney?money(n):num(n));
const normalizeDaily=x=>{if(!x||!validDate(x.date))return null;const reading=safeNum(x.reading);return reading===null||reading<0?null:{date:x.date,reading:Math.round(reading*1000)/1000}};

const normalize=r=>{if(!r||typeof r!=='object'||!TYPES[r.type]||!validDate(r.date))return null;const amount=safeNum(r.amount);if(amount===null||amount<0)return null;return {id:String(r.id||id()),type:r.type,date:r.date,period:typeof r.period==='string'?r.period:'',startDate:validDate(r.startDate)?r.startDate:'',billedAmount:safeNum(r.billedAmount),previous:safeNum(r.previous),current:safeNum(r.current),liters:safeNum(r.liters),odometer:safeNum(r.odometer),kg:safeNum(r.kg),amount,due:validDate(r.due)?r.due:'',status:r.status==='unpaid'?'unpaid':'paid',note:String(r.note||'').slice(0,500),createdAt:String(r.createdAt||new Date().toISOString()),updatedAt:String(r.updatedAt||new Date().toISOString())}};
let db={records:[],dailyReadings:[]},page='overview',filter={type:'all',month:'all',search:''},editId=null,toastTimer;
try{const raw=localStorage.getItem(KEY);if(raw){const data=JSON.parse(raw);if(Array.isArray(data.records))db.records=data.records.map(normalize).filter(Boolean);if(Array.isArray(data.dailyReadings))db.dailyReadings=data.dailyReadings.map(normalizeDaily).filter(Boolean)}}catch(e){alert('Saved records could not be loaded. Do NOT add new records until you recover your JSON backup. Details: '+e.message);}
function save(){try{localStorage.setItem(KEY,JSON.stringify(db));return true}catch(e){alert('Could not save on this browser/device. Export a backup and check private browsing/storage settings. '+e.message);return false}}
function notice(t){const el=$('#toast');el.textContent=t;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),3500)}

const typeTotal=(list,type)=>list.filter(r=>r.type===type).reduce((a,r)=>a+r.amount,0);
const monthRecords=m=>db.records.filter(r=>r.date.slice(0,7)===m);
const total=list=>list.reduce((sum,r)=>sum+r.amount,0);
const qty=r=>{if(r.type==='electricity'||r.type==='water')return r.current!==null&&r.previous!==null?r.current-r.previous:0;if(r.type==='lpg')return r.kg||0;return r.liters||0};

const sixMonths=()=>{const d=new Date(),out=[];for(let i=5;i>=0;i--){const s=new Date(d.getFullYear(),d.getMonth()-i,1);out.push([s.getFullYear(),String(s.getMonth()+1).padStart(2,'0')].join('-'))}return out};

function render(){document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.page===page));$('#app').innerHTML=page==='overview'?overview():page==='records'?recordsPage():page==='add'?formPage():page==='insights'?insights():page==='calculations'?calculationsPage():page==='ai'?aiPage():backupPage();if(page==='add')initForm();if(page==='records')initFilters();if(page==='ai')initAi();if(page==='calculations')initCalculations();if(page==='backup'){updateOfflineDisplay();updateUpdateDisplay();if(!updateAutoChecked){updateAutoChecked=true;checkForUpdates()}}}
function overview(){const m=monthNow(),cur=monthRecords(m),lastDate=new Date();lastDate.setMonth(lastDate.getMonth()-1);const prevKey=`${lastDate.getFullYear()}-${String(lastDate.getMonth()+1).padStart(2,'0')}`,prev=total(monthRecords(prevKey)),curCost=total(cur),unpaid=db.records.filter(r=>(r.type==='electricity'||r.type==='water')&&r.status==='unpaid'),unpaidTotal=total(unpaid),months=sixMonths(),vals=months.map(k=>total(monthRecords(k))),max=Math.max(...vals,1),recent=ordered(db.records).slice(0,5);
return `<div class="topline"><div><h2>Household Overview</h2><div class="muted fine">${monthLabel(m)} · Combined monitoring</div></div><button class="btn primary" data-action="new">+ Add Expense / Reading</button></div>
<div class="kpis"><div class="kpi accent"><div class="label">This month's spending</div><div class="value">${money(curCost)}</div><div class="foot">${cur.length} record(s)</div></div><div class="kpi"><div class="label">Previous month's spending</div><div class="value">${money(prev)}</div><div class="foot">${monthLabel(prevKey)}</div></div><div class="kpi"><div class="label">Outstanding utility bills</div><div class="value">${money(unpaidTotal)}</div><div class="foot">${unpaid.length} unpaid electricity/water bill(s)</div></div><div class="kpi"><div class="label">All-time spending</div><div class="value">${money(total(db.records))}</div><div class="foot">${db.records.length} total record(s)</div></div></div>
<div class="panel" style="margin-top:16px"><div class="between"><h3>${monthLabel(m)} by category</h3><span class="smallmuted">Amount + recorded quantity</span></div><div class="grid5">${Object.entries(TYPES).map(([k,v])=>{const rows=cur.filter(r=>r.type===k);return `<div class="category"><div class="icon-circle">${v.icon}</div><div class="label">${v.name}</div><b>${money(total(rows))}</b><div class="mini">${num(rows.reduce((x,r)=>x+qty(r),0))} ${v.unit} recorded</div></div>`}).join('')}</div></div>
<div class="split"><div class="panel"><div class="between"><h3>Spending trend</h3><span class="smallmuted">Last 6 months</span></div><div class="monthbars">${months.map((k,i)=>`<div class="monthitem"><span class="money">${vals[i]?money(vals[i]).replace('.00',''): '₱0'}</span><div class="column" style="height:${Math.max(2,(vals[i]/max)*113)}px" title="${escape(monthLabel(k))}: ${money(vals[i])}"></div><label>${monthLabel(k).split(' ')[0]}</label></div>`).join('')}</div><div class="footnote">Grouped by the record date you enter. Bills are included whether paid or unpaid.</div></div><div class="panel"><div class="between"><h3>Recent records</h3><button class="btn small ghost" data-action="view-records">View all</button></div>${recent.length?recent.map(r=>brief(r)).join(''):'<div class="empty">No records yet. Add your first bill, fuel purchase or LPG refill.</div>'}</div></div>

async function commandWorkerCache(worker){

if(/\b(how much|total|spend|spent|cost|expense|pay|paid|budget|history|breakdown)\b/.test(q)){const sums=summarizeTypes(rows).filter(x=>x.count);return `${label}: ${money(total(rows))} across ${rows.length} record(s).\n`+(sums.length?sums.map(x=>`${x.name}: ${money(x.amount)} (${x.count} record(s))`).join('\n'):'No matching records.')+'\nTotals include unpaid bills and use the date of each record.'}
return `I can answer exact questions about your saved records, including spending, quantity, prices, comparisons, due dates and savings alerts.\n\nTry: “${AI_SUGGESTIONS[0]}” or “${AI_SUGGESTIONS[1]}”. For more conversational explanations, you can use Chrome’s optional on-device AI if it is supported on your device.`}
function aiAskPage(){return `<div class="topline"><h3>Ask AI</h3><span class="smallmuted">Ask about your water, electricity, fuel & LPG</span></div><div class="panel"><form id="aiQuestionForm"><div class="field"><label for="aiQuestion">Your question</label><textarea id="aiQuestion" maxlength="350" rows="3" placeholder="Example: How much did I spend on electricity last month?">${escape(aiQuestion)}</textarea></div><div class="actions"><button class="btn primary" type="submit">Ask about my records</button><button class="btn ghost" type="button" data-action="ai-clear">Clear</button></div></form><div class="ai-examples"><div class="smallmuted"><b>Try asking:</b></div><div class="ai-chip-row">${AI_SUGGESTIONS.map(x=>`<button class="ai-chip" type="button" data-action="ai-example" data-question="${escape(x)}">${escape(x)}</button>`).join('')}</div></div></div>
${aiResponse?`<div class="panel"><div class="between"><h3>Answer</h3><span class="tag paid">Local analysis</span></div><div class="ai-response" id="aiResponse" role="status">${escape(aiResponse)}</div><div class="footnote">Calculated from records on this device only. Please verify important decisions against original bills.</div></div>`:''}
<div class="panel"><div class="between"><div><h3 style="margin-bottom:3px">✨ Optional Chrome built-in AI</h3><div class="fine muted" id="nativeStatus">${escape(aiNativeStatus)}</div></div><button type="button" class="btn outline" data-action="ai-native" ${aiNativeBusy?'disabled':''}>${aiNativeBusy?'Generating…':'Explain with on-device AI'}</button></div><p class="fine muted">When available, compatible desktop Chrome can explain an answer using an on-device language model. It may need a one-time model download and suitable hardware. This never uses a paid API or sends records to an external AI service. On Safari/iPhone or unsupported browsers, the free local question engine above still works.</p>${aiNativeText?`<div class="ai-response ai-native" role="status">${escape(aiNativeText)}</div><p class="footnote">AI-written explanation; check amounts against the exact local calculation above.</p>`:''}</div>`}
function aiPage(){return `<div class="topline"><div><h2>🧠 Utility AI Center</h2><div class="muted fine">Free, private, read-only · No API key or subscription</div></div></div><div class="ai-tabs" role="tablist" aria-label="Utility AI features"><button class="ai-tab ${aiTab==='analyst'?'active':''}" role="tab" aria-selected="${aiTab==='analyst'}" data-ai-tab="analyst">📊 AI Analyst</button><button class="ai-tab ${aiTab==='ask'?'active':''}" role="tab" aria-selected="${aiTab==='ask'}" data-ai-tab="ask">💬 Ask AI</button><button class="ai-tab ${aiTab==='advisor'?'active':''}" role="tab" aria-selected="${aiTab==='advisor'}" data-ai-tab="advisor">💡 AI Advisor</button></div><div id="aiContent">${aiTab==='analyst'?analyzePage():aiTab==='ask'?aiAskPage():aiAdvisorPage()}</div><div class="fine muted">The AI features read saved utility records but never change them. Your data remains in this browser unless you export it. Built-in AI availability varies by browser and device.</div>`}
function initAi(){const select=$('#aiPeriod');if(select){select.value=aiPeriod;select.addEventListener('change',e=>{aiPeriod=e.target.value;render()})}const ask=$('#aiQuestionForm');if(ask){ask.addEventListener('submit',e=>{e.preventDefault();askAI()});const field=$('#aiQuestion');field?.addEventListener('input',e=>{aiQuestion=e.target.value})}if(aiTab==='ask'&&!aiNativeChecked)checkChromeAI()}
function askAI(){const question=$('#aiQuestion')?.value?.trim()||aiQuestion.trim();if(!question){notice('Enter a question first.');$('#aiQuestion')?.focus();return}aiQuestion=question.slice(0,350);aiResponse=answerQuestion(aiQuestion);aiResponseKind='local';aiNativeText='';render()}
async function checkChromeAI(){aiNativeChecked=true;if(!('LanguageModel' in window)){aiNativeStatus='Browser model not supported here · local Ask AI is ready';$('#nativeStatus')?.replaceChildren(document.createTextNode(aiNativeStatus));return}try{const a=await window.LanguageModel.availability();aiNativeStatus=a==='available'?'On-device Chrome model ready':a==='downloadable'?'Chrome model available for one-time download':a==='downloading'?'Chrome model is downloading':'On-device model unavailable · local Ask AI is ready'}catch(e){aiNativeStatus='On-device Chrome AI unavailable · local Ask AI is ready'}$('#nativeStatus')?.replaceChildren(document.createTextNode(aiNativeStatus))}
async function explainWithNative(){if(aiNativeBusy)return;if(!aiResponse){aiNativeText='Ask a question about your records first; the browser model will explain the calculated answer.';render();return}if(!('LanguageModel' in window)){aiNativeText='This browser does not offer the on-device Prompt API. Your local Ask AI answers are fully functional, with no subscription.';render();return}aiNativeBusy=true;aiNativeText='Starting browser AI…';render();let session;try{
 // Creation starts directly from this user-initiated click; no remote API is used.
 session=await window.LanguageModel.create({monitor(m){m.addEventListener('downloadprogress',e=>{aiNativeText=`Downloading device AI model: ${Math.round((e.loaded||0)*100)}%`;const view=document.querySelector('.ai-native');if(view)view.textContent=aiNativeText})}});
 const facts=`Question: ${aiQuestion}\nExact answer computed from saved records:\n${aiResponse}\nRecords count: ${db.records.length}. Spending by type (all-time): ${summarizeTypes(db.records).map(x=>x.name+' '+money(x.amount)).join('; ')}.`;
 const instruction='You are a household-utilities assistant. Explain the exact provided calculation in clear, friendly English, in no more than 130 words. Treat numbers in the source as authoritative; never invent amounts, dates, due dates or prices. Mention if a comparison uses a partial month. Provide practical advice only when relevant. Do not claim to make changes. If unsure, say what cannot be concluded.\n\n'+facts;
 const result=await session.prompt(instruction);aiNativeText=String(result||'No explanation returned.').slice(0,3000);
}catch(e){aiNativeText=`On-device model could not run (${String(e.message||e).slice(0,150)}). Local Ask AI remains available with no paid service.`}finally{try{session?.destroy?.()}catch{}aiNativeBusy=false;if(page==='ai'&&aiTab==='ask')render()}}

document.addEventListener('click',e=>{const b=e.target.closest('[data-page],[data-action],[data-ai-tab],[data-calc-tab]');if(!b)return;if(b.dataset.calcTab){calcTab=b.dataset.calcTab;render();return}if(b.dataset.aiTab){aiTab=b.dataset.aiTab;render();return}if(b.dataset.page){if(b.dataset.page==='add')editId=null;go(b.dataset.page);return}const a=b.dataset.action,key=b.dataset.id;switch(a){case 'new':editId=null;go('add');break;case 'view-records':go('records');break;case 'view-backup':go('backup');break;case 'cancel':editId=null;go('records');break;case 'edit':editId=key;go('add');break;case 'delete':{const r=db.records.find(x=>x.id===key);if(r&&confirm(`Delete ${TYPES[r.type].name} record from ${dateLabel(r.date)} (${money(r.amount)})?`)){const before=db.records;db.records=db.records.filter(x=>x.id!==key);if(!save()){db.records=before;return}render();notice('Record deleted')}break}case 'toggle-paid':{const r=db.records.find(x=>x.id===key);if(r){const old=r.status;r.status=old==='paid'?'unpaid':'paid';r.updatedAt=new Date().toISOString();if(!save()){r.status=old;return}render();notice('Payment status updated')}break}case 'open-calculations':go('calculations');break;case 'import-daily':importDailyCSV();break;case 'export-daily':exportDailyCSV();break;case 'delete-daily':deleteDaily(b.dataset.date);break;case 'ai-example':aiQuestion=b.dataset.question||'';aiNativeText='';aiTab='ask';render();askAI();break;case 'ai-clear':aiQuestion='';aiResponse='';aiNativeText='';render();break;case 'ai-native':explainWithNative();break;case 'ai-refresh':render();notice('Alerts refreshed from saved records');break;case 'prepare-offline':prepareOffline(true);break;case 'check-updates':checkForUpdates();break;case 'apply-update':applyAvailableUpdate();break;case 'export-json':exportJSON();break;case 'export-csv':exportCSV();break;case 'import-json':importJSON();break;case 'clear':eraseAll();break}});
render();
})();
</script>
