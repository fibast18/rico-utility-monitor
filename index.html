<!doctype html>
<html lang="en">
<head>

<title>Rico Utility Monitor</title>
<style>
:root{--bg:#f3f6fa;--panel:#fff;--ink:#15253c;--muted:#6b7a90;--line:#e4eaf1;--navy:#12213a;--aqua:#18b7a3;--light:#e7faf6;--red:#c44747;--amber:#a66a0b;--shadow:0 10px 28px rgba(28,49,78,.06)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.5;cursor:not-allowed}
header{background:linear-gradient(128deg,#12213a,#1d4161);color:#fff;padding:21px max(18px,calc((100vw - 1160px)/2));box-shadow:0 3px 14px #0001}.brand{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.brand h1{font-size:22px;letter-spacing:-.5px;margin:0}.brand p{margin:2px 0 0;color:#bfcbdd;font-size:12px}.brand-mark{display:inline-grid;place-items:center;width:39px;height:39px;border-radius:13px;background:#ffffff20;margin-right:11px;font-size:21px}.brand-left{display:flex;align-items:center}
.shell{max-width:1160px;margin:auto;padding:18px 18px 45px}.tabs{display:flex;gap:7px;overflow-x:auto;margin-bottom:20px;padding-bottom:4px}.tab{border:1px solid var(--line);background:white;color:var(--muted);padding:10px 15px;border-radius:12px;white-space:nowrap;font-weight:650}.tab.active{background:var(--navy);color:#fff;border-color:var(--navy)}.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:650;background:var(--navy);color:#fff}.btn.primary{background:var(--aqua);color:#052b29}.btn.ghost{background:#eaf0f6;color:var(--ink)}.btn.outline{border:1px solid var(--line);background:white;color:var(--ink)}.btn.danger{color:var(--red);background:#faebeb}.btn.small{padding:6px 10px;font-size:12px}.btn:focus-visible,.tab:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #75d7ce;outline-offset:2px}
.topline{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin:0 0 15px}.topline h2{font-size:22px;margin:0;letter-spacing:-.3px}.muted{color:var(--muted)}.fine{font-size:12px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:17px;padding:18px;box-shadow:var(--shadow);margin-bottom:16px}.panel h3{margin:0 0 12px;font-size:17px}.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.kpi{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;min-width:0}.kpi .value{font-size:clamp(18px,2.4vw,28px);letter-spacing:-.7px;font-weight:760;margin:8px 0 3px;overflow-wrap:anywhere}.kpi .label{color:var(--muted);font-size:12px;font-weight:650}.kpi .foot{font-size:12px;color:var(--muted)}.kpi.accent{background:var(--navy);color:white;border:0}.kpi.accent .label,.kpi.accent .foot{color:#bbcde2}.split{display:grid;grid-template-columns:1.15fr .85fr;gap:16px}.grid5{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}.category{border:1px solid var(--line);border-radius:13px;padding:12px;min-width:0}.category b{display:block;font-size:20px;overflow-wrap:anywhere}.category .label{font-size:12px;color:var(--muted)}.category .mini{font-size:11px;color:var(--muted)}.icon-circle{display:inline-grid;place-items:center;background:#f0f4f8;border-radius:10px;width:34px;height:34px;margin-bottom:8px}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.between{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.line{border-top:1px solid var(--line);padding:12px 0}.line:first-child{border-top:0;padding-top:0}.title-label{font-weight:680}.smallmuted{font-size:12px;color:var(--muted)}.amount{font-weight:770;white-space:nowrap}.tag{display:inline-block;border-radius:99px;font-size:11px;padding:3px 8px;font-weight:700;background:#eef2f6;color:#53657b}.tag.unpaid{background:#fff1d9;color:#8c5b06}.tag.paid{background:#e5f8ee;color:#196b43}
.bar-group{margin:0 0 14px}.bar-label{display:flex;justify-content:space-between;gap:10px;margin-bottom:5px;font-size:13px}.track{height:11px;background:#edf2f6;border-radius:99px;overflow:hidden}.fill{height:100%;border-radius:99px;background:var(--aqua)}.monthbars{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));align-items:end;gap:10px;height:165px;margin:15px 0 3px;border-bottom:1px solid var(--line)}.monthitem{display:flex;align-items:center;flex-direction:column;justify-content:end;height:100%;gap:5px;min-width:0}.column{width:clamp(18px,75%,45px);background:linear-gradient(180deg,#1ac5ad,#54b5d1);border-radius:7px 7px 0 0;min-height:3px}.monthitem label{font-size:11px;color:var(--muted);white-space:nowrap}.monthitem .money{font-size:11px;font-weight:700;white-space:nowrap}
.filters{display:flex;gap:10px;align-items:end;flex-wrap:wrap}.field{display:flex;flex-direction:column;gap:5px;min-width:0}.field label{font-size:12px;font-weight:680;color:#526178}.field input,.field select,.field textarea{width:100%;border:1px solid #cfd9e4;border-radius:10px;padding:10px 11px;background:#fff;color:var(--ink);min-height:43px}.field textarea{resize:vertical;min-height:72px}.filters .field{flex:1;min-width:145px}.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.full{grid-column:1/-1}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.form-wrap{max-width:760px;margin:auto}.hint{background:#f0f8f8;color:#365d60;border-radius:10px;padding:10px 12px;font-size:12px;margin-top:10px}.records{display:grid;gap:9px}.record{display:flex;align-items:center;justify-content:space-between;gap:10px;background:white;border:1px solid var(--line);border-radius:13px;padding:12px 14px}.record-details{min-width:0;overflow-wrap:anywhere}.record .buttons{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}.record-right{text-align:right;min-width:115px}.record-right .amount{font-size:17px}.record .detail{font-size:12px;color:var(--muted)}.record-actions{margin-top:6px}.empty{text-align:center;color:var(--muted);padding:27px 10px;border:1px dashed #cfd9e4;border-radius:12px}.stat-table{width:100%;border-collapse:collapse}.stat-table th,.stat-table td{padding:10px 7px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}.stat-table th:first-child,.stat-table td:first-child{text-align:left}.scroll{overflow-x:auto}.message{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:12px 17px;border-radius:11px;z-index:8;box-shadow:0 8px 32px #0004;max-width:calc(100vw - 25px);text-align:center;display:none}.message.show{display:block}input[type=file]{max-width:100%}.footnote{color:var(--muted);font-size:12px;margin-top:8px}.pill{color:#a6f3e7;background:#ffffff20;font-size:11px;padding:5px 10px;border-radius:99px;white-space:nowrap}
@media(max-width:800px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.split{grid-template-columns:1fr}.grid5{grid-template-columns:repeat(2,minmax(0,1fr))}.grid5>.category:last-child{grid-column:1/-1}.monthbars{gap:5px}}@media(max-width:530px){.shell{padding:13px 12px 32px}.panel{padding:14px}.kpi{padding:12px}.kpi .value{font-size:21px}.fields{grid-template-columns:1fr}.full{grid-column:1}.record{align-items:flex-start}.record-right{min-width:100px}.record .buttons{gap:4px}.record .buttons button{padding:5px 7px}.brand h1{font-size:18px}.monthitem label{font-size:10px}.monthitem .money{font-size:9px}}
</style>
</head>
<body>
<header><div class="brand"><div class="brand-left"><span class="brand-mark">⚡</span><div><h1>Rico Utility Monitor</h1><p>Household bills · vehicle fuel · LPG</p></div></div><span class="pill">v1.0 · Private on this device</span></div></header>
<main class="shell">
<nav class="tabs" aria-label="Sections"><button class="tab active" data-page="overview">📊 Overview</button><button class="tab" data-page="records">📋 Records</button><button class="tab" data-page="add">➕ Add Record</button><button class="tab" data-page="insights">📈 Insights</button><button class="tab" data-page="backup">⚙️ Backup</button></nav>
<div id="app"></div>
</main><div id="toast" class="message" role="status" aria-live="polite"></div>
<script>
(()=>{'use strict';
const KEY='rico-utility-monitor-v1';
const TYPES={electricity:{name:'Electricity',icon:'⚡',unit:'kWh'},water:{name:'Water',icon:'💧',unit:'m³'},car:{name:'Car Fuel',icon:'🚗',unit:'L'},motorcycle:{name:'Motorcycle Fuel',icon:'🏍️',unit:'L'},lpg:{name:'LPG / Cooking Gas',icon:'🔥',unit:'kg'}};
const $=s=>document.querySelector(s), money=n=>'₱'+(Number(n)||0).toLocaleString('en-PH',{minimumFractionDigits:2,maximumFractionDigits:2}),num=n=>(Number(n)||0).toLocaleString('en-PH',{maximumFractionDigits:2});
const today=()=>{const d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')},monthNow=()=>today().slice(0,7);
const escape=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dateLabel=s=>{if(!/^\d{4}-\d{2}-\d{2}$/.test(s||''))return s||'';const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d).toLocaleDateString('en-PH',{month:'short',day:'numeric',year:'numeric'})};
const monthLabel=s=>{const [y,m]=s.split('-').map(Number);return new Date(y,m-1,1).toLocaleDateString('en-PH',{month:'short',year:'numeric'})};
const id=()=>typeof crypto!=='undefined'&&crypto.randomUUID?crypto.randomUUID():'id-'+Date.now()+'-'+Math.random().toString(36).slice(2);
const validDate=s=>typeof s==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(s)&&!Number.isNaN(new Date(s+'T12:00:00').getTime());
const safeNum=x=>x===null||x===''||x===undefined?null:(Number.isFinite(Number(x))?Number(x):null);
const normalize=r=>{if(!r||typeof r!=='object'||!TYPES[r.type]||!validDate(r.date))return null;const amount=safeNum(r.amount);if(amount===null||amount<0)return null;return {id:String(r.id||id()),type:r.type,date:r.date,period:typeof r.period==='string'?r.period:'',previous:safeNum(r.previous),current:safeNum(r.current),liters:safeNum(r.liters),odometer:safeNum(r.odometer),kg:safeNum(r.kg),amount,due:validDate(r.due)?r.due:'',status:r.status==='unpaid'?'unpaid':'paid',note:String(r.note||'').slice(0,500),createdAt:String(r.createdAt||new Date().toISOString()),updatedAt:String(r.updatedAt||new Date().toISOString())}};
let db={records:[]},page='overview',filter={type:'all',month:'all',search:''},editId=null,toastTimer;
try{const raw=localStorage.getItem(KEY);if(raw){const data=JSON.parse(raw);if(Array.isArray(data.records))db.records=data.records.map(normalize).filter(Boolean)}}catch(e){alert('Saved records could not be loaded. Do NOT add new records until you recover your JSON backup. Details: '+e.message);}
function save(){try{localStorage.setItem(KEY,JSON.stringify(db));return true}catch(e){alert('Could not save on this browser/device. Export a backup and check private browsing/storage settings. '+e.message);return false}}
function notice(t){const el=$('#toast');el.textContent=t;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),3500)}
const ordered=arr=>[...arr].sort((a,b)=>b.date.localeCompare(a.date)||(b.createdAt||'').localeCompare(a.createdAt||''));
const typeTotal=(list,type)=>list.filter(r=>r.type===type).reduce((a,r)=>a+r.amount,0);
const monthRecords=m=>db.records.filter(r=>r.date.slice(0,7)===m);
const total=list=>list.reduce((sum,r)=>sum+r.amount,0);
const qty=r=>{if(r.type==='electricity'||r.type==='water')return r.current!==null&&r.previous!==null?r.current-r.previous:0;if(r.type==='lpg')return r.kg||0;return r.liters||0};
const typeOptions=(all=false)=>`${all?'<option value="all">All categories</option>':''}`+Object.entries(TYPES).map(([k,v])=>`<option value="${k}">${v.icon} ${v.name}</option>`).join('');
const sixMonths=()=>{const d=new Date(),out=[];for(let i=5;i>=0;i--){const s=new Date(d.getFullYear(),d.getMonth()-i,1);out.push([s.getFullYear(),String(s.getMonth()+1).padStart(2,'0')].join('-'))}return out};
function go(next){page=next;render();window.scrollTo({top:0,behavior:'smooth'})}
function render(){document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.page===page));$('#app').innerHTML=page==='overview'?overview():page==='records'?recordsPage():page==='add'?formPage():page==='insights'?insights():backupPage();if(page==='add')initForm();if(page==='records')initFilters()}
function overview(){const m=monthNow(),cur=monthRecords(m),lastDate=new Date();lastDate.setMonth(lastDate.getMonth()-1);const prevKey=`${lastDate.getFullYear()}-${String(lastDate.getMonth()+1).padStart(2,'0')}`,prev=total(monthRecords(prevKey)),curCost=total(cur),unpaid=db.records.filter(r=>(r.type==='electricity'||r.type==='water')&&r.status==='unpaid'),unpaidTotal=total(unpaid),months=sixMonths(),vals=months.map(k=>total(monthRecords(k))),max=Math.max(...vals,1),recent=ordered(db.records).slice(0,5);
return `<div class="topline"><div><h2>Household Overview</h2><div class="muted fine">${monthLabel(m)} · Combined monitoring</div></div><button class="btn primary" data-action="new">+ Add Expense / Reading</button></div>
<div class="kpis"><div class="kpi accent"><div class="label">This month's spending</div><div class="value">${money(curCost)}</div><div class="foot">${cur.length} record(s)</div></div><div class="kpi"><div class="label">Previous month's spending</div><div class="value">${money(prev)}</div><div class="foot">${monthLabel(prevKey)}</div></div><div class="kpi"><div class="label">Outstanding utility bills</div><div class="value">${money(unpaidTotal)}</div><div class="foot">${unpaid.length} unpaid electricity/water bill(s)</div></div><div class="kpi"><div class="label">All-time spending</div><div class="value">${money(total(db.records))}</div><div class="foot">${db.records.length} total record(s)</div></div></div>
<div class="panel" style="margin-top:16px"><div class="between"><h3>${monthLabel(m)} by category</h3><span class="smallmuted">Amount + recorded quantity</span></div><div class="grid5">${Object.entries(TYPES).map(([k,v])=>{const rows=cur.filter(r=>r.type===k);return `<div class="category"><div class="icon-circle">${v.icon}</div><div class="label">${v.name}</div><b>${money(total(rows))}</b><div class="mini">${num(rows.reduce((x,r)=>x+qty(r),0))} ${v.unit} recorded</div></div>`}).join('')}</div></div>
<div class="split"><div class="panel"><div class="between"><h3>Spending trend</h3><span class="smallmuted">Last 6 months</span></div><div class="monthbars">${months.map((k,i)=>`<div class="monthitem"><span class="money">${vals[i]?money(vals[i]).replace('.00',''): '₱0'}</span><div class="column" style="height:${Math.max(2,(vals[i]/max)*113)}px" title="${escape(monthLabel(k))}: ${money(vals[i])}"></div><label>${monthLabel(k).split(' ')[0]}</label></div>`).join('')}</div><div class="footnote">Grouped by the record date you enter. Bills are included whether paid or unpaid.</div></div><div class="panel"><div class="between"><h3>Recent records</h3><button class="btn small ghost" data-action="view-records">View all</button></div>${recent.length?recent.map(r=>brief(r)).join(''):'<div class="empty">No records yet. Add your first bill, fuel purchase or LPG refill.</div>'}</div></div>
<div class="panel"><strong>Important:</strong> This GitHub Pages app saves your records only in this browser on this device. It does not automatically sync between your phone and computer. <button class="btn small outline" data-action="view-backup">Export your backup</button></div>`}
function brief(r){const v=TYPES[r.type];return `<div class="line row"><div><div class="title-label">${v.icon} ${v.name}</div><div class="smallmuted">${dateLabel(r.date)} · ${num(qty(r))} ${v.unit}${r.status==='unpaid'?' · Unpaid':''}</div></div><span class="amount">${money(r.amount)}</span></div>`}
function recordsPage(){return `<div class="topline"><h2>All Records <span class="muted fine">(${db.records.length})</span></h2><button class="btn primary" data-action="new">+ New Record</button></div><div class="panel"><div class="filters"><div class="field"><label for="fType">Category</label><select id="fType">${typeOptions(true)}</select></div><div class="field"><label for="fMonth">Month</label><select id="fMonth"><option value="all">All months</option>${[...new Set(db.records.map(r=>r.date.slice(0,7)))].sort().reverse().map(m=>`<option value="${m}">${monthLabel(m)}</option>`).join('')}</select></div><div class="field"><label for="fSearch">Search notes</label><input id="fSearch" placeholder="Notes or date" value="${escape(filter.search)}"></div></div></div><div id="recordList"></div>`}
function initFilters(){if(!$('#fType'))return;$('#fType').value=filter.type;$('#fMonth').value=filter.month;$('#fType').addEventListener('change',e=>{filter.type=e.target.value;drawRecords()});$('#fMonth').addEventListener('change',e=>{filter.month=e.target.value;drawRecords()});$('#fSearch').addEventListener('input',e=>{filter.search=e.target.value;drawRecords()});drawRecords()}
function drawRecords(){const list=ordered(db.records.filter(r=>(filter.type==='all'||r.type===filter.type)&&(filter.month==='all'||r.date.startsWith(filter.month))&&(!filter.search||[r.note,r.date,r.period,TYPES[r.type].name].join(' ').toLowerCase().includes(filter.search.toLowerCase()))));$('#recordList').innerHTML=`<div class="between" style="margin-bottom:10px"><div class="muted fine">${list.length} matching record(s) · ${money(total(list))}</div></div><div class="records">${list.length?list.map(recordCard).join(''):'<div class="empty">No matching records.</div>'}</div>`}
function recordCard(r){const v=TYPES[r.type],measure=qty(r),extra=(r.type==='electricity'||r.type==='water')?`${num(r.previous)} → ${num(r.current)} ${v.unit}${r.period?' · Period '+r.period:''}`:(r.type==='car'||r.type==='motorcycle')?`${num(measure)} L${r.odometer!==null?' · Odometer '+num(r.odometer)+' km':''}`:`${num(measure)} kg LPG`;const isBill=r.type==='electricity'||r.type==='water';return `<article class="record"><div class="record-details"><div class="title-label">${v.icon} ${v.name} ${isBill?`<span class="tag ${r.status}">${r.status==='paid'?'Paid':'Unpaid'}</span>`:''}</div><div class="detail">${dateLabel(r.date)} · ${extra}</div>${isBill&&r.due?`<div class="detail">Due: ${dateLabel(r.due)}</div>`:''}${measure>0?`<div class="detail">Average cost: ${money(r.amount/measure)} per ${v.unit}</div>`:''}${r.note?`<div class="detail">${escape(r.note)}</div>`:''}</div><div class="record-right"><div class="amount">${money(r.amount)}</div><div class="buttons record-actions">${isBill?`<button class="btn small ghost" data-action="toggle-paid" data-id="${escape(r.id)}">${r.status==='paid'?'Unpay':'Paid'}</button>`:''}<button class="btn small ghost" data-action="edit" data-id="${escape(r.id)}">Edit</button><button class="btn small danger" data-action="delete" data-id="${escape(r.id)}">Delete</button></div></div></article>`}
function formPage(){const r=db.records.find(x=>x.id===editId),isEdit=!!r,kind=r?.type||'electricity';return `<div class="form-wrap"><div class="topline"><h2>${isEdit?'Edit Record':'Add Utility Record'}</h2><button class="btn outline" data-action="view-records">← All Records</button></div><form id="recordForm" class="panel"><div class="fields"><div class="field"><label for="kind">Category *</label><select id="kind" required ${isEdit?'disabled':''}>${typeOptions()}</select></div><div class="field"><label for="day">Record / transaction date *</label><input type="date" id="day" required value="${r?.date||today()}"></div></div><div id="dynamicFields"></div><div class="fields" style="margin-top:13px"><div class="field"><label for="amount">Total amount (PHP) *</label><input type="number" id="amount" min="0" step="0.01" required placeholder="e.g. 1250.50" value="${r?escape(r.amount):''}"></div><div class="field"><label for="note">Notes (optional)</label><input id="note" maxlength="500" placeholder="Account, station, receipt, etc." value="${escape(r?.note||'')}"></div></div><div class="hint" id="hint"></div><div class="actions"><button type="submit" class="btn primary">${isEdit?'Save Changes':'Save Record'}</button><button type="button" class="btn ghost" data-action="cancel">Cancel</button></div></form></div>`}
function recentPrevious(type,day,excludeId){const candidates=db.records.filter(r=>r.type===type&&r.date<day&&r.id!==excludeId&&r.current!==null);return ordered(candidates)[0]?.current??null}
function initForm(){const r=db.records.find(x=>x.id===editId);$('#kind').value=r?.type||'electricity';const draw=()=>{const k=$('#kind').value,day=$('#day').value,prev=r?.previous??recentPrevious(k,day,r?.id);let html='';if(k==='electricity'||k==='water'){html=`<div class="fields" style="margin-top:13px"><div class="field"><label for="period">Billing month</label><input type="month" id="period" value="${escape(r?.period||day.slice(0,7))}"></div><div class="field"><label for="due">Payment due date</label><input type="date" id="due" value="${escape(r?.due||'')}"></div><div class="field"><label for="previous">Previous meter reading *</label><input type="number" id="previous" min="0" step="any" required value="${prev??''}" placeholder="Reading before this bill"></div><div class="field"><label for="current">Current meter reading *</label><input type="number" id="current" min="0" step="any" required value="${r?.current??''}" placeholder="Latest reading"></div><div class="field"><label for="status">Payment status</label><select id="status"><option value="unpaid">Unpaid</option><option value="paid">Paid</option></select></div></div>`}else if(k==='car'||k==='motorcycle'){html=`<div class="fields" style="margin-top:13px"><div class="field"><label for="liters">Fuel purchased (liters) *</label><input type="number" min="0.001" step="any" id="liters" required value="${r?.liters??''}" placeholder="e.g. 25.50"></div><div class="field"><label for="odometer">Odometer reading (km, optional)</label><input type="number" min="0" step="any" id="odometer" value="${r?.odometer??''}" placeholder="e.g. 45120"></div></div>`}else{html=`<div class="fields" style="margin-top:13px"><div class="field"><label for="kg">LPG refill / tank weight (kg) *</label><input type="number" min="0.001" step="any" id="kg" required value="${r?.kg??11}" placeholder="e.g. 11"></div></div>`}$('#dynamicFields').innerHTML=html;if($('#status'))$('#status').value=r?.status||'unpaid';$('#hint').textContent=(k==='electricity'||k==='water')?'Consumption = current − previous meter reading. The app suggests the most recent earlier reading when available. Review readings before saving.':(k==='car'||k==='motorcycle')?'Fuel is counted when purchased. Record the odometer each time for approximate distance-between-refills analysis. Accurate km/L requires consistent full-tank refills.':'LPG purchases are tracked in kg. Enter a new record whenever you buy or replace a tank.'};
$('#kind').addEventListener('change',draw);$('#day').addEventListener('change',()=>{if(!r&&($('#kind').value==='electricity'||$('#kind').value==='water')){const x=recentPrevious($('#kind').value,$('#day').value);if(x!==null&&$('#previous'))$('#previous').value=x}});
$('#recordForm').addEventListener('submit',submitRecord);draw()}
function submitRecord(e){e.preventDefault();const read=s=>$('#'+s)?.value??'',type=read('kind'),date=read('day'),amount=safeNum(read('amount')),old=db.records.find(x=>x.id===editId);if(!validDate(date)||amount===null||amount<0){notice('Please check the date and amount');return}const data={id:old?.id||id(),type,date,amount,period:'',previous:null,current:null,liters:null,odometer:null,kg:null,due:'',status:'paid',note:read('note').trim().slice(0,500),createdAt:old?.createdAt||new Date().toISOString(),updatedAt:new Date().toISOString()};
if(type==='water'||type==='electricity'){data.previous=safeNum(read('previous'));data.current=safeNum(read('current'));data.period=read('period');data.due=read('due');data.status=read('status');if(data.previous===null||data.current===null||data.previous<0||data.current<data.previous){alert('Current meter reading must be greater than or equal to previous reading.');return}}else if(type==='car'||type==='motorcycle'){data.liters=safeNum(read('liters'));data.odometer=safeNum(read('odometer'));if(data.liters===null||data.liters<=0||data.odometer!==null&&data.odometer<0){alert('Enter valid fuel liters and odometer.');return}}else{data.kg=safeNum(read('kg'));if(data.kg===null||data.kg<=0){alert('Enter the LPG tank/refill weight in kg.');return}}
if(!old&&db.records.some(r=>r.type===type&&r.date===date&&r.amount===amount&&r.current===data.current&&r.liters===data.liters&&r.kg===data.kg)&&!confirm('A similar record already exists for this category, date and amount. Save another anyway?'))return;
const oldRecords=[...db.records];if(old)db.records=db.records.map(r=>r.id===old.id?data:r);else db.records.push(data);if(!save()){db.records=oldRecords;return}editId=null;page='records';filter={type:'all',month:'all',search:''};render();notice(old?'Record updated':'Record saved')}
function insights(){const m=monthNow(),months=sixMonths(),byType=Object.entries(TYPES).map(([k,v])=>({k,...v,cost:typeTotal(db.records,k),count:db.records.filter(r=>r.type===k).length,quantity:db.records.filter(r=>r.type===k).reduce((a,r)=>a+qty(r),0)})),max=Math.max(1,...byType.map(x=>x.cost));let distances=['car','motorcycle'].map(k=>{const list=[...db.records].filter(r=>r.type===k&&r.odometer!==null).sort((a,b)=>a.date.localeCompare(b.date)||(a.createdAt||'').localeCompare(b.createdAt||''));let km=0;for(let i=1;i<list.length;i++)if(list[i].odometer>=list[i-1].odometer)km+=list[i].odometer-list[i-1].odometer;return {type:k,km,count:list.length}});
const lpg=ordered(db.records.filter(r=>r.type==='lpg')).reverse(),diffs=[];for(let i=1;i<lpg.length;i++){let days=Math.round((new Date(lpg[i].date+'T12:00:00')-new Date(lpg[i-1].date+'T12:00:00'))/86400000);if(days>0)diffs.push(days)};
return `<div class="topline"><h2>Insights & Consumption</h2><div class="muted fine">Based on your saved records</div></div><div class="split"><div class="panel"><h3>Total spending by category</h3>${byType.map(x=>`<div class="bar-group"><div class="bar-label"><span>${x.icon} ${x.name} <span class="muted fine">(${x.count} records)</span></span><b>${money(x.cost)}</b></div><div class="track"><div class="fill" style="width:${x.cost/max*100}%"></div></div><div class="fine muted">Total quantity recorded: ${num(x.quantity)} ${x.unit}</div></div>`).join('')}</div><div class="panel"><h3>6-month comparison</h3><div class="scroll"><table class="stat-table"><thead><tr><th>Month</th><th>Water</th><th>Electricity</th><th>Fuel + LPG</th><th>Total</th></tr></thead><tbody>${months.slice().reverse().map(mm=>{const arr=monthRecords(mm);return `<tr><td>${monthLabel(mm)}</td><td>${money(typeTotal(arr,'water'))}</td><td>${money(typeTotal(arr,'electricity'))}</td><td>${money(typeTotal(arr,'car')+typeTotal(arr,'motorcycle')+typeTotal(arr,'lpg'))}</td><td><b>${money(total(arr))}</b></td></tr>`}).join('')}</tbody></table></div></div></div>
<div class="panel"><h3>Monthly quantities recorded</h3><div class="scroll"><table class="stat-table"><thead><tr><th>Month</th><th>Water (m³)</th><th>Electricity (kWh)</th><th>Car (L)</th><th>Motorcycle (L)</th><th>LPG (kg)</th></tr></thead><tbody>${months.slice().reverse().map(mm=>{const arr=monthRecords(mm);return `<tr><td>${monthLabel(mm)}</td>${['water','electricity','car','motorcycle','lpg'].map(k=>`<td>${num(arr.filter(r=>r.type===k).reduce((s,r)=>s+qty(r),0))}</td>`).join('')}</tr>`}).join('')}</tbody></table></div><div class="footnote">Meter differences for water/electricity; amounts purchased for fuel and LPG.</div></div><div class="split"><div class="panel"><h3>Vehicle fuel tracking</h3>${distances.map(x=>{const list=db.records.filter(r=>r.type===x.type),liters=list.reduce((a,r)=>a+(r.liters||0),0);return `<div class="line"><div class="between"><b>${TYPES[x.type].icon} ${TYPES[x.type].name}</b><b>${money(total(list))}</b></div><div class="muted fine">${num(liters)} liters purchased · ${list.length} refill(s)</div><div class="muted fine">${num(x.km)} km between recorded odometer readings (${x.count} readings)</div></div>`}).join('')}<div class="footnote">Distance is not fuel economy. A reliable km/L calculation requires complete, consistent full-tank logs.</div></div><div class="panel"><h3>LPG replacement pattern</h3><div class="kpi" style="margin-bottom:10px"><div class="label">Average gap between recorded LPG purchases</div><div class="value">${diffs.length?num(diffs.reduce((a,b)=>a+b,0)/diffs.length)+' days':'Not enough records'}</div><div class="foot">${lpg.length} purchase(s) recorded</div></div><div class="fine muted">Assumes each LPG entry represents a tank replacement; partial refills or multiple tanks can change the actual usage rate.</div></div></div><div class="panel"><h3>Understanding consumption</h3><p class="muted fine">Water (m³) and electricity (kWh) consumption are calculated from meter differences. Fuel liters and LPG kilograms reflect what you purchased, not necessarily what was used within that month. Expense totals use the transaction date, and include unpaid bills.</p></div>`}
function backupPage(){return `<div class="topline"><h2>Backup, Restore & Privacy</h2></div><div class="split"><div class="panel"><h3>📦 Protect your data</h3><p class="muted">Records are stored in this device's browser storage, not on GitHub. Clearing site data, changing browsers, or losing your device may erase local records.</p><p><b>${db.records.length}</b> record(s) on this device.</p><div class="actions"><button class="btn primary" data-action="export-json">Download JSON Backup</button><button class="btn outline" data-action="export-csv">Export CSV</button></div><div class="footnote">Back up regularly and keep your JSON file somewhere safe (such as iCloud Drive).</div></div><div class="panel"><h3>📥 Restore JSON backup</h3><div class="field"><label for="restoreFile">Select a backup file</label><input type="file" id="restoreFile" accept=".json,application/json"></div><div class="field" style="margin-top:12px"><label for="importMode">Import mode</label><select id="importMode"><option value="merge">Merge (keep existing records; match by ID)</option><option value="replace">Replace all local records</option></select></div><button class="btn ghost" data-action="import-json" style="margin-top:14px">Import Backup</button><div class="footnote">CSV is for spreadsheets; only this app's JSON backups can be restored.</div></div></div><div class="panel"><h3>🌐 GitHub Pages hosting</h3><p class="muted">Publishing this single <code>index.html</code> file makes the app accessible at your GitHub Pages URL. The app code is public, but your saved records remain in the browser unless you export and share them.</p><p class="muted">Your phone and computer will maintain separate records. To move records between them, export JSON on one and import it on the other. Using private browsing or clearing website data can remove stored records.</p><div class="actions"><button class="btn danger" data-action="clear">Erase all records on this device</button></div></div>`}
function download(name,contents,type){const blob=new Blob([contents],{type});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function exportJSON(){download('rico-utility-backup-'+today()+'.json',JSON.stringify({app:'Rico Utility Monitor',version:1,exportedAt:new Date().toISOString(),records:db.records},null,2),'application/json');notice('JSON backup downloaded')}
function exportCSV(){const cols=['id','type','date','period','previous','current','liters','odometer','kg','amount','due','status','note','createdAt','updatedAt'];const cell=x=>{let s=x==null?'':String(x);if(/^[=+\-@\t\r]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"'};download('rico-utility-records-'+today()+'.csv','\ufeff'+cols.join(',')+'\r\n'+ordered(db.records).map(r=>cols.map(c=>cell(r[c])).join(',')).join('\r\n'),'text/csv;charset=utf-8');notice('CSV exported')}
async function importJSON(){const f=$('#restoreFile')?.files?.[0];if(!f){alert('Choose a JSON backup file first.');return}let data;try{data=JSON.parse(await f.text())}catch{alert('This file is not valid JSON.');return}if(!data||data.app!=='Rico Utility Monitor'||!Array.isArray(data.records)){alert('This is not a recognized Rico Utility Monitor backup.');return}const valid=data.records.map(normalize).filter(Boolean);if(valid.length!==data.records.length){alert('Backup contains invalid records. No changes made.');return}const mode=$('#importMode').value;if(!confirm(`Import ${valid.length} record(s) using ${mode.toUpperCase()} mode? ${mode==='replace'?'This will erase existing local records first.':'Records with the same ID will be updated from the backup.'}`))return;const prior=db.records;if(mode==='replace')db.records=valid;else{const all=new Map(prior.map(r=>[r.id,r]));valid.forEach(r=>all.set(r.id,r));db.records=[...all.values()]}if(!save()){db.records=prior;return}render();notice(`Imported ${valid.length} record(s)`)}
function eraseAll(){if(!confirm('Erase ALL local utility records? This cannot be undone without a backup.'))return;if(!confirm('Final confirmation: permanently erase all records stored on this device?'))return;const old=db.records;db.records=[];if(!save()){db.records=old;return}render();notice('All local records erased')}
document.addEventListener('click',e=>{const b=e.target.closest('[data-page],[data-action]');if(!b)return;if(b.dataset.page){if(b.dataset.page==='add')editId=null;go(b.dataset.page);return}const a=b.dataset.action,key=b.dataset.id;switch(a){case 'new':editId=null;go('add');break;case 'view-records':go('records');break;case 'view-backup':go('backup');break;case 'cancel':editId=null;go('records');break;case 'edit':editId=key;go('add');break;case 'delete':{const r=db.records.find(x=>x.id===key);if(r&&confirm(`Delete ${TYPES[r.type].name} record from ${dateLabel(r.date)} (${money(r.amount)})?`)){const before=db.records;db.records=db.records.filter(x=>x.id!==key);if(!save()){db.records=before;return}render();notice('Record deleted')}break}case 'toggle-paid':{const r=db.records.find(x=>x.id===key);if(r){const old=r.status;r.status=old==='paid'?'unpaid':'paid';r.updatedAt=new Date().toISOString();if(!save()){r.status=old;return}render();notice('Payment status updated')}break}case 'export-json':exportJSON();break;case 'export-csv':exportCSV();break;case 'import-json':importJSON();break;case 'clear':eraseAll();break}});
render();
})();
</script>
